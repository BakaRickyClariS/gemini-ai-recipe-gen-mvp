services:
  api1:
    build: .
    container_name: recipe-api-api1
    env_file: .env
    ports:
      - "3001:3000"
    restart: unless-stopped

  api2:
    build: .
    container_name: recipe-api-api2
    env_file: .env
    ports:
      - "3002:3000"
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: recipe-api-nginx
    depends_on:
      - api1
      - api2
    ports:
      - "8080:80"
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: recipe-api-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
